services: 
  estudiantes: 
    build: . 
    # sin sección ports: no se expone fuera de la red de Docker 

  usuarios: 
    build: ../../practica3-rest 
    ports: 
      - "3000:3000" 
    environment: 
      GRPC_ADDR: estudiantes:50051 
      MONGO_URL: "mongodb://host.docker.internal:27017"
      MONGO_DB: "practica3"
      PORT: "3000"
    depends_on: 
      - estudiantes